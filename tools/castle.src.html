<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffe1f1">
<title>Julia's Reading Castle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<style>
/* single-look by choice: pastel princess castle */
:root{color-scheme:light;--bg:#fff0f8;--pink:#ff7eb6;--deep:#c2185b;--btn:#d81b7a;--btnsh:#9c1050;--grn:#17803f;--grnsh:#0d5a2a;--gold:#ffc83d;--cons:#1e66f5;--vowel:#e0245e;--ink:#3b1d3f;--violet:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;background:#f6dcf2;background:linear-gradient(#ffe1f1,#e9d5ff);font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;color:var(--ink);touch-action:manipulation;overflow-x:hidden}
#app{max-width:760px;margin:0 auto;min-height:100%;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;text-align:center;font-size:clamp(24px,6vw,40px);color:var(--deep);overflow-wrap:anywhere}
h2{margin:0;font-size:24px;color:var(--deep);overflow-wrap:anywhere}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:24px;gap:8px}
.btn{border:0;border-radius:24px;padding:16px 26px;min-height:56px;font:inherit;font-size:24px;font-weight:700;background:var(--btn);color:#fff;box-shadow:0 5px 0 var(--btnsh);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btnsh)}
.btn:disabled{opacity:.8}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #c99500}
.btn.green{background:var(--grn);box-shadow:0 5px 0 var(--grnsh)}
.btn.violet{background:var(--violet);box-shadow:0 5px 0 #4c1d95}
.btn.small{font-size:16px;padding:10px 14px;min-height:48px;border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 8px 0 #e3b5d6;text-align:center}
.wordcard{padding:22px 8px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative}
.letters{display:flex;gap:clamp(4px,1.6vw,10px);justify-content:center;width:100%;padding:0 4px}
.L{--n:3;flex:1 1 0;min-width:0;max-width:130px;height:clamp(100px,26vw,150px);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:min(96px,calc(66vw / var(--n)));line-height:1;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s}
.L.c{background:var(--cons)}.L.v{background:var(--vowel)}
.L.lit{transform:scale(1.12);filter:brightness(1.25);outline:6px solid var(--gold)}
.pic{font-size:80px;height:90px;line-height:90px}
.hint{font-size:20px;min-height:28px;padding:0 6px;overflow-wrap:anywhere}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stars{letter-spacing:2px}
.progress{height:18px;background:#fff;border-radius:12px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));width:0;transition:width .4s}
.big{font-size:72px}
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.rec .btn{font-size:20px;padding:10px;min-height:64px}
.rec .btn.has{background:var(--grn);box-shadow:0 5px 0 var(--grnsh)}
.rec .btn.live{background:#e11d48;animation:p 1s infinite}
@keyframes p{50%{opacity:.6}}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.hidden{display:none!important}
.small-note{font-size:14px;opacity:.9;overflow-wrap:anywhere}
#ab{position:fixed;left:0;right:0;top:0;z-index:9;margin:0;box-shadow:0 4px 12px rgba(0,0,0,.25);padding:14px 16px;background:#fff3c4;border-bottom:4px solid #e0a800;color:#5a3b00;font-size:20px;font-weight:700;text-align:center;cursor:pointer}
/* microphone button */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.mic{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff9ccb,var(--pink) 55%,var(--deep));color:#fff;font-size:62px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #8e0f46;cursor:pointer;touch-action:manipulation;padding:0}
.mic:active{transform:translateY(4px);box-shadow:0 3px 0 #8e0f46}
.mic.nudge{animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:scale(1.07)}}
.mic.listening{background:radial-gradient(circle at 35% 30%,#b794f6,var(--violet) 60%,#4c1d95);box-shadow:0 8px 0 #3b0f78}
.mic.listening::before,.mic.listening::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:5px solid var(--violet);opacity:0;animation:ring 1.4s infinite}
.mic.listening::after{animation-delay:.7s}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.55);opacity:0}}
.mic.thinking{opacity:.6}
.mic[data-phase=feedback]{opacity:.4}
.miclab{font-size:22px;font-weight:700;color:var(--deep);min-height:30px;text-align:center}
#fx{position:fixed;left:50%;top:36%;width:0;height:0;pointer-events:none;z-index:8}
#fx span{position:absolute;font-size:34px;animation:fly 1.3s ease-out forwards;margin:-17px 0 0 -17px}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
.cbpanel{background:linear-gradient(#fff7d6,#ffe08a);border:4px solid var(--gold);border-radius:22px;padding:10px 14px;font-size:22px;font-weight:700;color:#6b4a00}
.why{font-size:14px;color:#6b4a00;background:#fff3c4;border-radius:12px;padding:8px 10px;overflow-wrap:anywhere;text-align:left;width:100%}
/* progress screen */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.tile{background:#fff7fc;border:3px solid #f3c6e3;border-radius:18px;padding:8px 4px;min-height:92px;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.tile .e{font-size:34px;line-height:1.1}
.tile.lock{background:#efe9f5;border-color:#d8cfe3;color:#8a7d99}
.tile.lock .e{filter:grayscale(1) brightness(0);opacity:.22}
.tile.grow{background:#eefbea;border-color:#b7e4ae}
.tile.got .tilestar{color:#d19a00;font-size:14px;min-height:18px}
.tiles.stk{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.sticker{background:#fff7fc;border:3px solid #f3c6e3;border-radius:18px;padding:8px 4px;min-height:110px;font-size:13px;overflow-wrap:anywhere}
.sticker .e{font-size:42px;line-height:1.15}
.sticker.lock{background:#efe9f5;border-color:#d8cfe3;color:#6f6380}
.sticker.lock .e{filter:grayscale(1) brightness(0);opacity:.22}
table.gt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
table.gt th,table.gt td{border-bottom:1px solid #eadcf0;padding:4px 2px;overflow-wrap:anywhere;text-align:center;vertical-align:top}
table.gt th{font-size:12px;color:var(--deep)}
.vcard{background:#fff7fc;border:4px solid #f3c6e3;border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.vcard.sel{border-color:var(--gold);background:linear-gradient(#fff7d6,#ffe9a8)}
.vtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:30px;font-weight:700;color:var(--deep)}
.vbadge{font-size:16px;background:var(--gold);color:var(--ink);border-radius:12px;padding:4px 10px;visibility:hidden}
.vcard.sel .vbadge{visibility:visible}
.vbtns,.seg{display:flex;gap:10px}
.vbtns .btn,.seg .btn{flex:1 1 0;min-width:0;padding:10px 8px}
.seg .btn[aria-pressed=true]{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #c99500}
.SW{font:inherit;border:0;background:#fff;border-radius:18px;padding:8px 14px;min-height:64px;min-width:56px;font-size:clamp(30px,10vw,52px);font-weight:700;color:var(--cons);box-shadow:0 5px 0 #c9b6e8;cursor:pointer;touch-action:manipulation;-webkit-user-select:none}
.SW.puz{color:var(--violet);border:3px dashed #b794f6}
.SW.lit{transform:scale(1.1);outline:6px solid var(--gold)}
.SW.got{background:#d9f9e6;box-shadow:0 0 0 4px #2fbf71,0 0 18px #2fbf71}
.SW.nyet{background:#ffe9cc;box-shadow:0 0 0 4px #ffb347}
.SW .dot{color:var(--ink)}
.sent{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;padding:8px 0}
.L.s{background:var(--violet)}
.slist{display:flex;flex-direction:column;gap:8px}
.stile{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff7fc;border:3px solid #f3c6e3;border-radius:18px;padding:10px 12px;min-height:56px;font-weight:700;text-align:left;overflow-wrap:anywhere}
.stile .e{font-size:30px}.stile .t{font-size:20px;flex:1 1 140px}
.stile.lock{background:#efe9f5;border-color:#d8cfe3;color:#8a7d99}.stile.lock .e{opacity:.5}
.holdbtn{position:relative;overflow:hidden}
.holdbtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(124,58,237,.35);pointer-events:none}
.holdbtn.holding i{width:100%;transition:width 2s linear}
@media (max-height:520px) and (orientation:landscape){
  #app{padding:8px 12px;gap:6px}.wordcard{min-height:0;padding:8px;gap:8px}.pic{font-size:44px;height:48px;line-height:48px}
  .L{height:72px;font-size:min(56px,calc(40vw / var(--n)))}.mic{width:96px;height:96px;font-size:44px}
  .hint{font-size:17px;min-height:22px}.miclab{font-size:18px;min-height:24px}.progress{height:10px}
  .SW{min-height:48px;font-size:28px;padding:4px 10px}.sent{gap:8px;padding:2px 0}
  /* word / sentence rounds: card on the left, mic + feedback in a right column so the mic is always on screen */
  #app:has(>#wc){display:grid;grid-template-columns:minmax(0,1fr) 190px;grid-template-rows:repeat(7,auto) 1fr;column-gap:12px;row-gap:6px;align-content:start;align-items:start}
  #app:has(>#wc)>.bar,#app:has(>#wc)>.progress{grid-column:1/-1}
  #app:has(>#wc)>#wc{grid-column:1;grid-row:3/9}
  #app:has(>#wc)>#micwrap,#app:has(>#wc)>#fb,#app:has(>#wc)>#why,#app:has(>#wc)>#extra{grid-column:2}
}
@media (prefers-reduced-motion:reduce){.mic.nudge,.mic.listening::before,.mic.listening::after,.pop{animation:none}}
</style>
</head>
<body>
<div id="ab" class="hidden" role="alert"></div>
<div id="app"></div>
<script>
// ---------- data ----------
const NAME = "JULIA";
const FAMILIES = {
  a:{label:"A",emoji:"🐱",words:["SAT","MAT","RAM","SAM","CAT","HAT","MAP","PAN","BAG","CAN","DAD","MAD"]},
  i:{label:"I",emoji:"🐷",words:["PIG","SIT","BIG","PIN","LIP","DIG","HIT","KID","ZIP"]},
  o:{label:"O",emoji:"🐶",words:["TOM","HOT","DOG","POT","MOP","TOP","BOX","FOX","HOP"]},
  u:{label:"U",emoji:"🌞",words:["SUN","BUS","CUP","BUG","MUD","RUN","FUN","NUT","JUG"]},
  e:{label:"E",emoji:"🐔",words:["RED","PEN","HEN","NET","BED","LEG","WET","JET","TEN"]}
};
const PIC = {RAM:"🐏",CAT:"🐱",HAT:"🎩",MAP:"🗺️",PAN:"🍳",BAG:"👜",PIG:"🐷",PIN:"📌",LIP:"👄",HOT:"🔥",DOG:"🐶",POT:"🍲",MOP:"🧹",BOX:"📦",FOX:"🦊",SUN:"🌞",BUS:"🚌",CUP:"☕",BUG:"🐛",NUT:"🥜",RED:"🔴",PEN:"🖊️",HEN:"🐔",NET:"🥅",BED:"🛏️",LEG:"🦵",JET:"✈️",KID:"🧒",DAD:"👨",ZIP:"🤐",SAT:"🪑",SIT:"🪑",SAM:"👦",TOM:"👦",CAN:"🥫",MAD:"😠",MAT:"🧶",BIG:"🐘",DIG:"⛏️",HIT:"🔨",TOP:"🔝",MUD:"🟤",RUN:"🏃",FUN:"🎉",WET:"💧",HOP:"🐇",JUG:"🏺",TEN:"🔟",JULIA:"👑"};
const ALL_WORDS = [...new Set(Object.values(FAMILIES).flatMap(f=>f.words))];
// "puzzle words": not sounded out, just learned by sight (taught as flash words before the sentences)
const SIGHT = ["I","A","IS","THE","SEE"];
const SIGHT_SET = new Set(SIGHT);
// Accepted spoken forms for puzzle words. Lenient on purpose: they are recorded but never cause a ladder step on their own.
const SIGHT_ALIAS = {I:["i","eye","aye","ay","ai","1"],A:["a","ah","uh","eh","ay","8"],IS:["is","its","iz"],THE:["the","thee","thuh","duh","da","a"],SEE:["see","sea","c","cee"]};
// sentences (tools/sentences.json -> build.py): {id,text,emoji,level}; words = the distinct words of the sentence
const SENTENCES = (__SENTENCES__).map(x=>({id:String(x.id),text:String(x.text),emoji:String(x.emoji),level:+x.level,
  words:String(x.text).match(/[A-Z]+/g)||[]})).filter(x=>x.words.length>=2);
const SENT_BY_ID = Object.create(null);SENTENCES.forEach(x=>{SENT_BY_ID[x.id]=x});
const VOWELS = "AEIOU";
const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
// last-resort robot-voice approximations (only if the built-in clips cannot play at all)
const TTS_FALLBACK = {A:"aah",B:"buh",C:"kuh",D:"duh",E:"eh",F:"fff",G:"guh",H:"huh",I:"ih",J:"juh",K:"kuh",L:"lll",M:"mmm",N:"nnn",O:"ah",P:"puh",Q:"kwuh",R:"rrr",S:"sss",T:"tuh",U:"uh",V:"vvv",W:"wuh",X:"ks",Y:"yuh",Z:"zzz"};
// praise clips Ppraise0..7 (all address her or are cheers)
const PRAISE = ["Great reading, Julia!","You did it, Princess!","Royal reader!","Brilliant, Julia!","Hooray!","Super star, Julia!","Magnificent, Princess Julia!","Wonderful reading, Julia!"];
const DONE_TEXT = "Well done, Princess Julia! You earned a sticker!";
const PHRASE = { // Pxxx clips and the robot-voice text used only if a clip cannot play
  say:"Say the word!", nohear:"I didn't hear you. Tap and try again!", tryagain:"Hmm, let's try again!",
  soundout:"Let's sound it out together.", nowyou:"Now you say it!", listen:"Listen.",
  practice:"Great practice, Julia!", comeback:"You got a comeback crown!", room:"A new room in your castle!",
  sread:"Read the sentence!", all:"Now read it all together!", sentpraise:"Great sentence reading, Julia!",
  star:"You earned a Sentence Star!", puzzle:"A puzzle word! Can you say it?"
};
// Spoken-answer aliases. A recognizer may return digits for a spoken number word, so TEN also accepts "10".
// Deliberately NOTHING else (no near-homophones, no one-letter slips: "sit" for SAT is a miss by design).
const ALIASES = { TEN:["10"], JULIA:["julie","yulia","hulia"] };
// Stickers / castle rooms. Unlock rules are checked by checkUnlocks(); locked ones show as silhouettes.
const CATALOG = [
  {id:"r1",  e:"🎀",name:"Sticker Bow",     need:"Finish 1 round",     ok:s=>s.stickers>=1},
  {id:"cb1", e:"👑",name:"Comeback Crown",  need:"Win 1 comeback",     ok:s=>s.comebacks>=1},
  {id:"st25",e:"🌟",name:"Star Collector",  need:"Collect 25 stars",   ok:s=>s.stars>=25},
  {id:"r3",  e:"💎",name:"Sparkle Gem",     need:"Finish 3 rounds",    ok:s=>s.stickers>=3},
  {id:"cb5", e:"🏰",name:"Throne Room",     need:"Win 5 comebacks",    ok:s=>s.comebacks>=5, room:true},
  {id:"r6",  e:"🦋",name:"Butterfly Wings", need:"Finish 6 rounds",    ok:s=>s.stickers>=6},
  {id:"st75",e:"🔮",name:"Magic Orb",       need:"Collect 75 stars",   ok:s=>s.stars>=75},
  {id:"cb10",e:"📚",name:"Library Tower",   need:"Win 10 comebacks",   ok:s=>s.comebacks>=10, room:true},
  {id:"r10", e:"🌈",name:"Rainbow Bridge",  need:"Finish 10 rounds",   ok:s=>s.stickers>=10},
  {id:"cb15",e:"🌹",name:"Rose Garden",     need:"Win 15 comebacks",   ok:s=>s.comebacks>=15, room:true},
  {id:"st150",e:"🪄",name:"Royal Wand",     need:"Collect 150 stars",  ok:s=>s.stars>=150},
  {id:"cb25",e:"🦄",name:"Unicorn Stable",  need:"Win 25 comebacks",   ok:s=>s.comebacks>=25, room:true}
];
// built-in clips (base64 mp3, generated offline): L<letter> = letter sound, W<WORD> = word, P<name> = phrase, S<name> = sentence.
// BUNDLE.voices = Kokoro neural voice packs {voiceId:{clipId:base64}}, BUNDLE.classic = the old espeak clips (letter
// style "Classic" and the last-resort fallback), BUNDLE.meta = [{id,name,blurb}] in picker order.
const BUNDLE = __CLIPS__;
const VOICES = BUNDLE.meta.filter(v=>BUNDLE.voices[v.id]);
const VOICE_IDS = VOICES.map(v=>v.id);
const DEFAULT_VOICE = VOICE_IDS.includes("angie") ? "angie" : VOICE_IDS.includes("af_heart") ? "af_heart" : VOICE_IDS[0];
const CLASSIC = BUNDLE.classic;

// ---------- storage ----------
// Every localStorage access is wrapped: private windows / blocked storage just mean "nothing is remembered".
const KEY = "jrg2", MAXLOG = 500;
const LS = {
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
};
// voice settings: which Kokoro voice, and whether letter sounds come from that voice or from the "Classic" espeak set
const PREF_KEY = "jrg-voice";
function cleanPrefs(p){
  const o = {voice:DEFAULT_VOICE, letters:"voice"};
  if(p && typeof p === "object" && !Array.isArray(p)){
    if(typeof p.voice === "string" && VOICE_IDS.includes(p.voice)) o.voice = p.voice;
    if(p.letters === "classic") o.letters = "classic";
  }
  return o;
}
let prefs = cleanPrefs(LS.get(PREF_KEY,null));
const savePrefs = () => LS.set(PREF_KEY,prefs);
const voiceName = id => (VOICES.find(v=>v.id===id)||{name:id}).name;
const WORD_RE = /^[A-Z]{1,6}$/;           // also keeps "__proto__" / "constructor" out of the maps
const CAT_IDS = new Set(CATALOG.map(c=>c.id));
const nz = x => Number.isFinite(+x) && +x > 0 ? Math.min(Math.floor(+x), 1e9) : 0;
const str = (x,n) => typeof x === "string" ? x.slice(0,n) : "";
function freshWord(){return {tries:0,wins:0,miss:0,first:0,streak:0,owes:false,missRound:0}}
function freshSent(){return {tries:0,wins:0,miss:0,first:0,owes:false,missRound:0,missed:Object.create(null)}}
function cleanState(s){
  const o = {stars:0,stickers:0,comebacks:0,streak:0,best:0,roundNo:0,family:"a",words:Object.create(null),attempts:[],earned:Object.create(null),crowns:[],sents:Object.create(null),sentStars:[]};
  if(!s || typeof s !== "object" || Array.isArray(s)) return o;
  o.stars=nz(s.stars); o.stickers=nz(s.stickers); o.comebacks=nz(s.comebacks);
  o.streak=nz(s.streak); o.best=nz(s.best); o.roundNo=nz(s.roundNo);
  if(typeof s.family==="string" && Object.prototype.hasOwnProperty.call(FAMILIES,s.family)) o.family=s.family;
  if(s.words && typeof s.words==="object" && !Array.isArray(s.words)){
    for(const k of Object.keys(s.words).slice(0,200)){
      if(!WORD_RE.test(k)) continue;
      const b=s.words[k]; if(!b || typeof b!=="object") continue;
      o.words[k]={tries:nz(b.tries),wins:nz(b.wins),miss:nz(b.miss),first:nz(b.first),streak:nz(b.streak),owes:b.owes===true,missRound:nz(b.missRound),heard:str(b.heard,60)};
      if(SIGHT_SET.has(k))o.words[k].sight=true;
    }
  }
  if(s.sents && typeof s.sents==="object" && !Array.isArray(s.sents)){
    for(const k of Object.keys(s.sents).slice(0,200)){
      if(!SENT_BY_ID[k])continue;
      const b=s.sents[k]; if(!b || typeof b!=="object")continue;
      const m=Object.create(null);
      if(b.missed && typeof b.missed==="object" && !Array.isArray(b.missed)) for(const w of Object.keys(b.missed).slice(0,8)) if(WORD_RE.test(w)&&nz(b.missed[w])) m[w]=Math.min(999,nz(b.missed[w]));
      o.sents[k]={tries:nz(b.tries),wins:nz(b.wins),miss:nz(b.miss),first:nz(b.first),owes:b.owes===true,missRound:nz(b.missRound),missed:m};
    }
  }
  if(Array.isArray(s.sentStars)) for(const k of s.sentStars.slice(0,200)) if(typeof k==="string" && SENT_BY_ID[k] && !o.sentStars.includes(k)) o.sentStars.push(k);
  if(Array.isArray(s.attempts)){
    for(const a of s.attempts.slice(-2000)){

  for(const a of (alts||[]).slice(0,5)){
    const toks=norm(a).split(" ").filter(Boolean);
    const got=alignSentence(words,toks);
    let dg=0,sg=0;words.forEach((w,k)=>{if(got[k]){if(SIGHT_SET.has(w))sg++;else dg++}});
    const score=dg*100+sg*10-Math.min(9,Math.max(0,toks.length-words.length));
    if(!best||score>best.score)best={score,got,heard:String(a==null?"":a).slice(0,100)};
  }
  if(!best)best={score:0,got:words.map(()=>false),heard:""};
  const decTotal=words.filter(w=>!SIGHT_SET.has(w)).length;
  const decGot=words.filter((w,k)=>!SIGHT_SET.has(w)&&best.got[k]).length;
  const first=words.findIndex((w,k)=>!SIGHT_SET.has(w)&&!best.got[k]);
  const res=words.map((w,k)=>best.got[k]?"1":SIGHT_SET.has(w)?"2":"0").join("");
  return {got:best.got,right:decGot===decTotal,decGot,decTotal,sightGot:words.filter((w,k)=>SIGHT_SET.has(w)&&best.got[k]).length,first,res,heard:best.heard,words};
}
function resumeAudio(){try{if(A.ctx&&A.ctx.state!=="running")A.ctx.resume().catch(()=>{})}catch{}}
function listen(o){
  const long=!!(o&&o.long), HARD=long?SENT_HARD_MS:HARD_MS, ABS=long?SENT_HARD_MS+8000:ABS_MS;
  return new Promise(resolve=>{
    const C=srCtor();
    if(!C){resolve({t:"error",code:"unsupported"});return}
    cancelListen();
    let r;
    try{r=new C()}catch{resolve({t:"error",code:"ctor"});return}
    const s={r,done:false,timers:[],resolve,started:false,segs:[],base:0,restarts:0,t0:Date.now()};
    // long mode: what was said so far, as up to 5 alternative transcripts (alternative j of every segment joined)
    const partial=()=>{
      const segs=s.segs.filter(Boolean);if(!segs.length)return {t:"none"};
      const alts=[];for(let j=0;j<5;j++){const t=segs.map(a=>a[j]||a[0]).join(" ");if(!alts.includes(t))alts.push(t)}
      return {t:"result",alts};
    };
    LIS=s;
    const clear=()=>{s.timers.forEach(clearTimeout);s.timers=[]};
    const fin=res=>{
      if(s.done)return; s.done=true; clear(); detach(r); if(LIS===s)LIS=null;
      setTimeout(resumeAudio,0); resolve(res);
    };
    s.fin=fin;
    s.arm=()=>{ // hard stop after HARD_MS; a stop() normally delivers a final result, else we give up after a short grace
      s.timers.forEach(clearTimeout);s.timers=[];
      s.timers.push(setTimeout(()=>{ if(s.done)return; s.stop() },HARD));
      s.timers.push(setTimeout(()=>giveUp(),ABS));
    };
    const giveUp=()=>{ if(s.done)return; try{r.abort()}catch{} fin(long&&s.segs.some(Boolean)?partial():{t:"none",timeout:true}) };
    s.stop=()=>{ // user tapped to stop, or the hard timeout: ask for the final result, but never wait forever
      if(s.done||s.stopping)return; s.stopping=true;
      try{r.stop()}catch{}
      s.timers.push(setTimeout(giveUp,GRACE_MS));
    };
    try{r.lang="en-US";r.interimResults=long;r.maxAlternatives=5;r.continuous=long}catch{}
    r.onstart=()=>{ if(s.done||LIS!==s)return; if(!s.started){s.started=true;s.t0=Date.now(); if(!s.stopping)s.arm()} };   // permission prompt time does not count
    r.onaudiostart=r.onstart;
    r.onresult=e=>{
      if(s.done||LIS!==s)return;
      if(long){
        try{for(let i=e.resultIndex||0;i<e.results.length;i++){
          const res=e.results[i],a=[];
          for(let j=0;j<res.length&&a.length<5;j++){const t=res[j]&&res[j].transcript;if(typeof t==="string"&&t.trim())a.push(t)}
          if(a.length)s.segs[s.base+i]=a;
        }}catch{}
        clearTimeout(s.sil);                                   // she is still reading: wait for a pause
        s.sil=setTimeout(()=>{ if(!s.done)s.stop() },SENT_SIL_MS);s.timers.push(s.sil);
        return;
      }
      const alts=[];
      try{
        for(let i=0;i<e.results.length;i++){const res=e.results[i];for(let j=0;j<res.length&&alts.length<5;j++){const t=res[j]&&res[j].transcript;if(typeof t==="string"&&t.trim())alts.push(t)}}
      }catch{}
      fin(alts.length?{t:"result",alts}:{t:"none"});
    };
    r.onerror=e=>{
      if(s.done||LIS!==s)return;
      const code=(e&&e.error)||"unknown";
      if(code==="no-speech"||code==="aborted")return fin(long?partial():{t:"none"});
      if(long&&s.segs.some(Boolean))return fin(partial());       // keep what was heard before the error
      fin({t:"error",code});
    };
    r.onend=()=>{
      if(s.done||LIS!==s)return;
      if(long){
        // the recognizer may end after the first words (child pace): listen again, keeping what we have
        if(!s.stopping&&s.segs.some(Boolean)&&s.restarts<3&&Date.now()-s.t0<HARD-800){
          s.restarts++;s.base=s.segs.length;
          try{r.start();return}catch{}
        }
        return fin(partial());
      }
      fin({t:"none"});
    };
    s.arm();
    try{r.start()}
    catch(e){
      // InvalidStateError ("already started") etc.: not the child's fault; let her tap again
      try{r.abort()}catch{}
      fin(e&&e.name==="InvalidStateError"?{t:"none",invalid:true}:{t:"error",code:"start-failed"});
    }
  });
}
function detach(r){["onstart","onaudiostart","onresult","onerror","onend","onspeechstart","onnomatch"].forEach(k=>{try{r[k]=null}catch{}})}
function stopListening(){ if(LIS&&!LIS.done)LIS.stop() }
function cancelListen(){
  const s=LIS; if(!s||s.done)return;
  s.done=true; s.timers.forEach(clearTimeout); s.timers=[]; LIS=null;
  detach(s.r); try{s.r.abort()}catch{}
  s.resolve({t:"cancelled"});
  setTimeout(resumeAudio,0);
}


// ---------- scheduling (missed words return more often) ----------
function pickRound(fam){
  const f=FAMILIES[fam]||FAMILIES.a;
  const pool=[...new Set(f.words)].map(x=>{const b=state.words[x]||{};return {x,w:Math.max(.3,1+2*nz(b.miss)+(b.owes?1:0)-Math.min(2,nz(b.wins))*0.3)}});
  const out=[];
  while(out.length<9&&pool.length){
    const tot=pool.reduce((s,o)=>s+o.w,0);let r=Math.random()*tot,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0].x);
  }
  out.push(NAME);return out;
}

      if(card.done||!alive())return;
      card.done=true;setPhase("feedback");const ep=stopAll();clearLit();cancelListen();
      $("extra").classList.add("hidden");
      recordPractice(w,heard);
      if(!requeued.has(w)&&!item.rq){requeued.add(w);deck.push({w,rq:true})} // back once more later; never loops
      reveal();setHint("Great practice, "+Name+"! 💪 We'll try this one again later.");
      const alive2=()=>live()&&i===myI&&!finished;
      (async()=>{
        const minShow=nap(1700,rid);
        await Promise.race([sayP("practice",ep),nap(3000,rid)]);if(!alive2())return;
        await minShow;if(!alive2())return;
        await nap(400,rid);if(!alive2())return;
        i++;show();
      })();
    }
    // ----- the ladder -----
    async function onMiss(heard){
      card.misses++;const step=card.misses;
      recordMiss(w,heard,step,roundNo);
      setPhase("prompt");const ep=stopAll();clearLit();
      const stale=()=>ep!==A.epoch||!alive();
      if(sight&&step<3){ // puzzle words are not sounded out: say it for her, then she repeats it
        setHint("Hmm, let's try again! Listen... 👂");
        await sayP("tryagain",ep);if(stale())return;
        if(!await wait(150,ep)||stale())return;
        reveal();await sayWord(w,ep);if(stale())return;
        if(!await wait(350,ep)||stale())return;
        setHint("Now you say it! 🎤");
        await sayP("nowyou",ep);if(stale())return;
        setPhase("idle");nudge();return;
      }
      if(step===1){
        setHint("Hmm, let's try again! Listen to the first sound 👂");
        await sayP("tryagain",ep);if(stale())return;
        if(!await wait(150,ep)||stale())return;
        L[0].classList.add("lit");await sayLetter(w[0],ep);L[0].classList.remove("lit");
        if(stale())return;
        setPhase("idle");setHint("Now tap the 🎤 and say the word!");nudge();
      }else if(step===2){
        setHint("Let's sound it out together! 👂");
        await sayP("soundout",ep);if(stale())return;
        if(!await wait(250,ep)||stale())return;
        for(let k=0;k<w.length;k++){
          L[k].classList.add("lit");await sayLetter(w[k],ep);L[k].classList.remove("lit");
          if(stale())return;
          if(!await wait(600,ep)||stale())return;
        }
        setHint("Now you say it! 🎤");
        await sayP("nowyou",ep);if(stale())return;
        setPhase("idle");nudge();
      }else{
        card.practice=true;
        setHint("Listen... 👂");
        await sayP("listen",ep);if(stale())return;
        if(!await wait(250,ep)||stale())return;
        reveal();
        await sayWord(w,ep);if(stale())return;
        if(!await wait(350,ep)||stale())return;
        setHint("Now you say it! 🎤");
        await sayP("nowyou",ep);if(stale())return;
        setPhase("idle");nudge();
      }
    }
    function noHear(){

      sayP("nohear",stopAll());
      if(card.noHear>=3){$("extra").classList.remove("hidden");showWhy("Grown-up: nothing was heard 3 times. Check the volume/mic, or use Next word / Grown-up buttons.")}
    }
    async function onMic(){
      if(!alive()||Date.now()<card.armedAt||M.fallback)return;
      if(card.phase==="feedback"||card.phase==="thinking")return;
      if(card.phase==="listening"){ // tap again = stop now (ignore the accidental double-tap right after starting)
        if(Date.now()-card.micStart<600)return;

      }
      if(!srCtor()){enterFallback("unsupported");return}

      card.micStart=Date.now();const tok=++card.tok;

        if(e.fatal)return enterFallback(e.reason);

      }

      const m=matches(w,res.alts);
      if(card.practice)return practiceDone(m||res.alts[0]||"");
      if(m)return success(m);
      return onMiss(res.alts[0]||"");
    }
    // ----- wiring -----
    L.forEach((el,k)=>{
      el.oncontextmenu=e=>e.preventDefault();
      el.onclick=async()=>{
        if(!alive()||card.phase==="feedback")return;
        card.touched=true;

    <div class="row" style="margin-top:14px"><button class="btn green" id="again">Again</button><button class="btn violet" id="mc">🏰 My Castle</button><button class="btn" id="home">🏠 Home</button></div></div>`);

// ---------- My Castle (progress) ----------
function castle(){
  leave();const rid=roundId;
  const groups=[...Object.values(FAMILIES).map(f=>({label:f.label+" words",emoji:f.emoji,words:f.words})),{label:"My name",emoji:"👑",words:[NAME]},{label:"Puzzle words",emoji:"🧩",words:SIGHT}];
  const tile=w=>{
    const b=state.words[w];
    if(!b||!b.wins)return `<div class="tile lock"><div class="e">${PIC[w]||"❓"}</div>${esc(w)}</div>`;
    return `<div class="tile got"><div class="e">${PIC[w]||"⭐"}</div>${esc(w)}<div class="tilestar">${"⭐".repeat(Math.min(3,b.wins))}${b.wins>=3?"👑":""}</div></div>`;
  };
  const practicing=[...ALL_WORDS,NAME].filter(w=>state.words[w]&&state.words[w].owes);
  const wonWords=[...ALL_WORDS,NAME].filter(w=>state.words[w]&&state.words[w].wins).length;
  const earnedN=CATALOG.filter(c=>state.earned[c.id]).length;
  h(`<div class="bar"><button class="btn small" id="back" aria-label="Home">🏠</button><h2>🏰 My Castle</h2><span></span></div>
  <div class="card"><div class="bar" style="justify-content:space-around;flex-wrap:wrap"><div>⭐ ${state.stars}</div><div>👑 ${state.comebacks}</div><div>🎀 ${state.stickers}</div><div>🔥 ${state.best}</div></div>
  <div class="small-note" style="margin-top:6px">stars · comeback crowns · stickers · best streak</div>
  ${wonWords?"":`<div style="font-size:22px;margin-top:10px">Read some words to fill your castle! ✨</div>`}</div>
  <div class="card"><h2>My Stickers &amp; Rooms</h2>
  <div class="small-note" style="margin:6px 0 10px">${earnedN} of ${CATALOG.length} found. Read more words to unlock the rest!</div>
  <div class="tiles stk" id="stk">${CATALOG.map(c=>state.earned[c.id]
    ?`<div class="sticker"><div class="e">${c.e}</div><b>${esc(c.name)}</b></div>`
    :`<div class="sticker lock"><div class="e">${c.e}</div><b>???</b><div>${esc(c.need)}</div></div>`).join("")}</div>
  ${state.crowns.length?`<div style="margin-top:12px;font-size:20px">My comeback crowns: ${state.crowns.slice(-12).map(c=>"👑 "+esc(c.s&&SENT_BY_ID[c.s]?SENT_BY_ID[c.s].emoji:c.w)).join(" &nbsp;")}</div>`:""}</div>
  <div class="card" id="scard"><h2>📖 Sentences I can read: <span id="scount">${readCount()}</span></h2>
  <div class="small-note" style="margin:6px 0">${readCount()?"Read a sentence right the first time to earn a Sentence Star ⭐":"Learn the words and puzzle words, then open Read sentences on the home screen! ✨"}</div>
  ${state.sentStars.length?`<div style="font-size:22px" id="sstars">Sentence Stars: ${state.sentStars.map(id=>"⭐"+esc((SENT_BY_ID[id]||{}).emoji||"")).join(" &nbsp;")}</div>`:""}</div>
  <div class="card"><h2>Words we're practicing 🌱</h2>
  ${practicing.length?`<div class="small-note" style="margin:6px 0 10px">Everybody practices! Read these right the first time to win a comeback crown 👑</div>
  <div class="tiles" id="prac">${practicing.map(w=>`<div class="tile grow"><div class="e">${PIC[w]||"🌱"}</div>${esc(w)}<div>🌱</div></div>`).join("")}</div>`
  :`<div style="font-size:20px;margin-top:8px">${wonWords?"Nothing to practice right now. Wow! 🌟":"Play a round and we will see! 🌱"}</div>`}</div>
  <div class="card"><h2>My Words (${wonWords} read)</h2>
  ${groups.map(g=>`<div style="font-size:22px;margin:12px 0 6px">${g.emoji} ${esc(g.label)}</div><div class="tiles">${g.words.map(tile).join("")}</div>`).join("")}</div>
  <div class="card" id="gcard"><button class="btn small holdbtn" id="hold" aria-label="Grown-ups: press and hold for 2 seconds"><i></i>👪 Grown-ups</button>
  <div class="small-note" style="margin-top:6px">Grown-ups: press and hold for 2 seconds.</div><div id="gpanel"></div></div>`);
  $("back").onclick=home;
  const hb=$("hold");let ht=null;
  const stop=()=>{if(ht){clearTimeout(ht);timers.delete(ht);ht=null}hb.classList.remove("holding")};
  hb.oncontextmenu=e=>e.preventDefault();
  hb.onpointerdown=()=>{stop();hb.classList.add("holding");ht=later(()=>{ht=null;hb.classList.remove("holding");grown(rid)},2000,rid)};
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>hb.addEventListener(ev,stop));
}
function grown(rid){
  const panel=$("gpanel");if(!panel||rid!==roundId)return;
  const rows=Object.keys(state.words).map(w=>[w,state.words[w]]).filter(([,b])=>b.tries>0).sort((a,b)=>b[1].miss-a[1].miss||a[0].localeCompare(b[0]));
  const arrow={up:"↑ better",down:"↓",same:"→","-":"-"};
  const wordsTab=()=>rows.length?`<table class="gt"><thead><tr><th style="width:17%">Word</th><th style="width:11%">Tries</th><th style="width:11%">Wins</th><th style="width:13%">1st try</th><th style="width:27%">Heard (miss)</th><th style="width:21%">Trend</th></tr></thead><tbody>${rows.map(([w,b])=>`<tr><td><b>${esc(w)}</b></td><td>${b.tries}</td><td>${b.wins}</td><td>${b.first}</td><td>${b.miss&&b.heard?esc(b.heard):"-"}</td><td>${arrow[trendOf(w)]}</td></tr>`).join("")}</tbody></table>`:`<div>No tries yet.</div>`;
  const sentTab=()=>{
    const rs=SENTENCES.map(x=>[x,state.sents[x.id]]).filter(([,b])=>b&&b.tries>0).sort((a,b)=>b[1].miss-a[1].miss||a[0].id.localeCompare(b[0].id));
    if(!rs.length)return `<div>No sentence tries yet.</div>`;
    return `<table class="gt" id="stable"><thead><tr><th style="width:36%">Sentence</th><th style="width:12%">Tries</th><th style="width:14%">1st try</th><th style="width:38%">Missed most</th></tr></thead><tbody>${rs.map(([x,b])=>`<tr><td><b>${esc(x.text)}</b></td><td>${b.tries}</td><td>${b.first}</td><td>${Object.entries(b.missed).sort((p,q)=>q[1]-p[1]).slice(0,3).map(([w,n])=>esc(w)+"×"+n).join(" ")||"-"}</td></tr>`).join("")}</tbody></table>`;
  };
  panel.innerHTML=`<div style="margin-top:12px;text-align:left"><h2 style="font-size:20px">Grown-up report</h2>
  <div class="small-note" style="margin:4px 0 8px">${state.attempts.length} tries logged (last ${MAXLOG} kept). "Heard" is the best guess the recognizer made on the last miss. Trend compares the latest tries with earlier ones.</div>
  <div class="row" style="margin:6px 0"><button class="btn small gold" id="tw" aria-pressed="true">Words</button><button class="btn small" id="ts" aria-pressed="false">Sentences</button></div>
  <div id="gtab"></div>
  <div class="row" style="margin-top:14px"><button class="btn small" id="reset">Reset progress</button></div>
  <div class="small-note" id="rnote" style="text-align:center;min-height:18px" aria-live="polite">Your recorded letter sounds are not touched.</div></div>`;
  const tab=w=>{$("gtab").innerHTML=w==="s"?sentTab():wordsTab();$("tw").classList.toggle("gold",w!=="s");$("ts").classList.toggle("gold",w==="s");$("tw").setAttribute("aria-pressed",w!=="s"?"true":"false");$("ts").setAttribute("aria-pressed",w==="s"?"true":"false")};
  $("tw").onclick=()=>tab("w");$("ts").onclick=()=>tab("s");tab("w");
  const rb=$("reset");let armed=false,at=null;
  rb.onclick=()=>{
    if(rid!==roundId)return;
    if(!armed){armed=true;rb.textContent="Tap again to erase everything";rb.classList.add("gold");
      at=later(()=>{armed=false;rb.textContent="Reset progress";rb.classList.remove("gold")},4000,rid);return}
    clearTimeout(at);
    const fam=state.family;state=cleanState(null);state.family=fam;save();
    castle();const n=$("gcard");if(n){const d=document.createElement("div");d.className="small-note";d.textContent="Progress was reset.";n.appendChild(d)}
  };
}

// ---------- grown-up microphone check ----------
function micTest(){
  leave();const rid=roundId;
  h(`<div class="bar"><button class="btn small" id="back">🏠 Back</button><h2 style="font-size:22px">Microphone check</h2><span></span></div>
  <div class="card"><div class="small-note" style="text-align:left">Grown-up: tap the mic and say a word, e.g. "sun". This shows what the recognizer heard (best guess first). Chrome needs the internet for this.
  <br>Speech recognition available: <b>${srCtor()?"yes":"NO"}</b> · secure page (https): <b>${window.isSecureContext?"yes":"NO"}</b></div>
  <div class="micwrap" style="margin-top:14px"><button class="mic" id="mic" aria-pressed="false" aria-label="Test the microphone">🎤</button><div class="miclab" id="miclab" aria-live="polite">Tap and say a word</div></div>
  <div id="mout" style="margin-top:12px;font-size:20px;overflow-wrap:anywhere" aria-live="polite"></div></div>`);
  $("back").onclick=home;
  let busy=false,tok=0;
  const lab=t=>{const e=$("miclab");if(e)e.textContent=t};
  $("mic").onclick=async()=>{
    if(rid!==roundId)return;
    if(busy){ if(LIS&&!LIS.stopping){lab("Hmm...");stopListening()} return }
    if(!srCtor()){$("mout").textContent="This browser has no speech recognition. Use Chrome on Android.";return}
    busy=true;const my=++tok;stopAll();
    $("mic").classList.add("listening");$("mic").setAttribute("aria-pressed","true");lab("Listening... tap to stop 🛑");$("mout").textContent="";
    const res=await listen();
    if(rid!==roundId||my!==tok)return;
    busy=false;$("mic").classList.remove("listening");$("mic").setAttribute("aria-pressed","false");lab("Tap and say a word");
    const out=$("mout");
    if(res.t==="cancelled")return;
    if(res.t==="result"){
      M.fails=0;
      out.innerHTML="Heard:<br>"+res.alts.map((a,k)=>`${k+1}. “${esc(a)}”${k===0?" (best)":""}`).join("<br>")+`<div class="small-note" style="margin-top:8px">The microphone and recognizer work${M.fallback?'. Go Home and press "Try the mic again" to use it in the game.':"."}</div>`;
    }else if(res.t==="none"){
      out.textContent="Nothing heard"+(res.invalid?" (the recognizer was busy; tap again)":"")+". Speak a little louder or closer, then tap again.";
    }else{
      const i=errInfo(res.code);
      out.innerHTML=`Error: <b>${esc(res.code)}</b><div class="small-note" style="margin-top:6px">${esc(PARENT_TEXT[i.reason]||PARENT_TEXT.other)}</div>`;
    }
  };
}

// ---------- grown-up recorder ----------
const EX={A:"apple",B:"bat",C:"cat (k)",D:"dog",E:"egg",F:"fan",G:"go",H:"hat",I:"igloo",J:"jam",K:"kite",L:"leg",M:"man",N:"net",O:"octopus",P:"pig",Q:"queen",R:"run",S:"sun",T:"top",U:"umbrella",V:"van",W:"web",X:"fox",Y:"yes",Z:"zip"};
let R=null; // active recording {mr,stream,L,timer}
function cancelRec(){
  const r=R;R=null;if(!r)return;
  clearTimeout(r.timer);
  try{if(r.mr){r.mr.ondataavailable=null;r.mr.onstop=null;if(r.mr.state!=="inactive")r.mr.stop()}}catch{}
  try{r.stream&&r.stream.getTracks().forEach(t=>t.stop())}catch{}
}
function setup(){
  leave();
  const gen=roundId;
  h(`<div class="bar"><button class="btn small" id="back">🏠 Back</button><h2 style="margin:0;font-size:22px">Record letter sounds</h2><span></span></div>
  <div class="card"><div class="small-note">Tap a letter, then say the <b>sound</b> (not the name), short and clean. Recording stops by itself after 3 seconds, or tap again. If the mic is blocked, your phone's voice recorder opens instead. Green = recorded; tap to hear it. Stored only on this device.</div>
  <div class="row" style="margin-top:10px"><button class="btn small ${rerec?'gold':''}" id="rr">↻ Re-record mode: ${rerec?'ON':'off'}</button></div>
  <div class="small-note" id="note" style="margin-top:8px;min-height:18px" aria-live="polite"></div></div>
  <div class="rec">${ALPHA.map(L=>`<button class="btn ${recorded[L]?'has':''}" data-l="${L}">${L}<br><span style="font-size:12px">${EX[L]}</span></button>`).join("")}</div>
  <input type="file" id="pick" accept="audio/*" capture class="hidden">`);
  const note=m=>{const e=document.getElementById("note");if(e)e.textContent=m};
  document.getElementById("back").onclick=home;
  document.getElementById("rr").onclick=()=>{rerec=!rerec;setup()};
  const pick=document.getElementById("pick");
  let cur=null,busy=false;
  const keep=async(L,blob)=>{
    A.cache.delete(recorded[L]);recorded[L]=blob;A.cache.delete(blob);await dbPut(L,blob);
    if(gen!==roundId)return; // user left the screen meanwhile; the sound is still saved
    setup();say("L",L,TTS_FALLBACK[L],{ep:stopAll()});
  };
  pick.onchange=()=>{const f=pick.files&&pick.files[0];const L=cur;cur=null;if(f&&L){if(f.size>4e6)return note("That file is too long. Record just the short sound.");keep(L,f)}};
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=async()=>{
    const L=b.dataset.l;
    if(R&&R.L===L){if(R.mr&&R.mr.state==="recording")R.mr.stop();return}
    if(R||busy)return;
    if(recorded[L]&&!rerec){say("L",L,TTS_FALLBACK[L],{ep:stopAll()});return}
    cur=L;
    let s;
    busy=true;
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==="undefined")throw new Error("no mic api");
      s=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch{
      busy=false;note("Mic not available here. Opening your phone's voice recorder...");pick.value="";pick.click();return;
    }
    busy=false;
    if(gen!==roundId){s.getTracks().forEach(t=>t.stop());return} // left the screen while permission was pending
    try{
      const mr=new MediaRecorder(s),chunks=[];
      const me={mr,stream:s,L,timer:0};R=me;
      mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      mr.onstop=()=>{
        clearTimeout(me.timer);s.getTracks().forEach(t=>t.stop());
        if(R!==me)return;R=null;
        const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
        if(!blob.size){note("Nothing was recorded. Try again.");setup();return}
        keep(L,blob);
      };
      mr.start();
      me.timer=setTimeout(()=>{try{if(mr.state==="recording")mr.stop()}catch{}},3000);
      b.classList.add("live");b.innerHTML=L+"<br>● stop";
    }catch{
      s.getTracks().forEach(t=>t.stop());R=null;
      note("Recording failed. Opening your phone's voice recorder...");pick.value="";pick.click();
    }
  });
}


window.addEventListener("unhandledrejection",e=>{A.lastErr="unhandled: "+(e.reason&&e.reason.message||e.reason)});
home();
(async()=>{
  await openDB();
  for(const L of ALPHA){const b=await dbGet(L);if(b instanceof Blob)recorded[L]=b}

})();
